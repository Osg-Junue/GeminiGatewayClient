name: CI

on:
  push:
    branches: [ master, main, v2 ]
  pull_request:
    branches: [ master, main, v2 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (warnings as errors)
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Run unit tests
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT smoke test (warnings as errors)
        run: dotnet publish tests/GeminiGatewayClient.AotSmoke -c Release -r linux-x64 -o artifacts/aot-smoke

      - name: Run Native AOT smoke test
        run: artifacts/aot-smoke/GeminiGatewayClient.AotSmoke

      - name: Publish Native AOT smoke test with the library trimmed, as in a real application
        run: dotnet publish tests/GeminiGatewayClient.AotSmoke -c Release -r linux-x64 -p:RootLibrary=false -o artifacts/aot-smoke-trimmed

      - name: Run trimmed Native AOT smoke test
        run: artifacts/aot-smoke-trimmed/GeminiGatewayClient.AotSmoke

      - name: Pack NuGet package
        run: dotnet pack GeminiGatewayClient/GeminiGatewayClient.csproj --no-build -c Release -o artifacts

      - name: Verify package contents
        run: |
          unzip -l artifacts/GeminiGatewayClient.*.nupkg | grep -E "README.md|GeminiGatewayClient.xml|LICENSE.txt"
